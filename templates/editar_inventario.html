<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Actualizar Inventario - Panaderia</title>
    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--CSS-->
    <link rel="stylesheet" href="/static/css/editar_inventario.css">
</head>

<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card">
            <h4 class="text-center mb-3"> Actualizar Inventario</h4>
            <div class="alert alert-secondary text-center py-2 mb-3">
                <strong>ID:</strong> {{ producto.id }} | <strong>Producto:</strong> {{ producto.nombre }}
            </div>
            <form action="/actualizar_inventario/{{ producto.id }}" method="POST" enctype="multipart/form-data">
                <div class="mb-2">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="nombre" class="form-control" value="{{ producto.nombre }}" required>
                </div>
                
                <div class="mb-2">
                    <label class="form-label">Stock</label>
                    <input type="number" name="stock" class="form-control" value="{{ producto.stock }}" required
                        min="0">
                </div>
                <div class="mb-3">
                    <label class="form-label">Grupo</label>
                    <select name="tipo" class="form-select">
                        <option value="producto" {% if producto.tipo=='producto' %}selected{% endif %}>Producto Venta
                        </option>
                        <option value="materia_prima" {% if producto.tipo=='materia_prima' %}selected{% endif %}>Materia
                            Prima</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Cambiar Imagen</label>
                    <input type="file" name="imagen" class="form-control" accept="image/*">
                </div>
                <div class="d-flex justify-content-between">
                    <a href="/producto?seccion=inventario" class="btn btn-secondary btn-sm">Volver</a>
                    <button type="submit" class="btn btn-success btn-sm">Guardar</button>
                </div>
            </form>
        </div>
    </div>
    <footer class="pie-pagina">
        <span>© Copyright <span id="anioActual"></span> – Panadería y Pastelería Manabita</span>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/anioactual.js"></script>
</body>

</html>
