<!-- sidebar.html -->
<nav class="col-md-2 sidebar">
    {% if rol == 'administrador' %}
    <!--h4 class="text-center">Panadería y Pasteleria "UNO"</h4-->
    <a href="/producto?seccion=dashboard" style="font-size: 20px;"> Dashboard</a>
    <a href="/producto?seccion=productos" style="font-size: 20px;"> Productos</a>
    <a href="/producto?seccion=inventario" style="font-size: 20px;"> Inventario</a>
    <a href="/producto?seccion=ventas" style="font-size: 20px;"> Ventas</a>
    {% elif rol == 'operativo' %}
    <a href="/producto?seccion=productos" style="font-size: 20px;"> Productos</a>
    <a href="/producto?seccion=ventas" style="font-size: 20px;"> Ventas</a>
    {% else %}
    <a href="/producto?seccion=ventas" style="font-size: 20px;"> Ventas</a>
    {% endif %}
    <!-- USUARIO -->
    <div class="card border-0 shadow-sm" style="border-radius:14px;">
        <div class="card-body">
            <div class="d-flex align-items-center gap-3 mb-3">
                <div
                    style="width:42px;height:42px;border-radius:50%;background:#0d6efd;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;">
                    {{ usuario[0]|upper }} </div>
                <div>
                    <p class="mb-0 fw-semibold" style="color: black;">{{ usuario }}</p> <span class="badge bg-dark">{{
                        rol }}</span>
                </div>
            </div>
            <hr class="my-2">
            <div class="d-flex justify-content-between" style="font-size:13px;"> <span class="text-muted">Estado</span>
                <span class="text-success fw-semibold">Activo</span>
            </div>
            <div class="d-flex justify-content-between mt-1" style="font-size:13px;"> <span class="text-muted">Total
                    productos</span> <span class="fw-semibold">{{
                    total_productos
                    }}</span>
            </div>
        </div>
    </div>
</nav>
